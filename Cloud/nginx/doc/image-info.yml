name: nginx
category: cloud
description: nginx 是一款高性能的 HTTP 和反向代理服务器。
license: BSD-2-Clause
environment: |
  本应用在Docker环境中运行，安装Docker执行如下命令
  ```
  yum install -y docker
  ```
tags: |
  | Tag | Currently | Architectures |
  |-----|-----------|---------------|
  |[1.27.2-oe2403lts](https://atomgit.com/openeuler/openeuler-docker-images/blob/master/Cloud/nginx/1.27.2/24.03-lts/Dockerfile) | nginx 1.27.2 on openEuler 24.03-lts | amd64, arm64 |
download: |
  ```
  docker pull openeuler/nginx:{{Tag}}
  ```
usage: |
  启动容器：
  ```
  docker run -d --name my-nginx -p 80:80 openeuler/nginx:{{Tag}}
  ```
license: BSD-2-Clause
similar_packages:
  - Apache HTTP Server: Apache 基金会的 HTTP 服务器
  - Caddy: 自动 HTTPS 的现代 Web 服务器
  - HAProxy: 高性能 TCP/HTTP 负载均衡器
dependency:
  - pcre
  - openssl
homepage: https://github.com/nginx/nginx
upstream:
  backend: GitHub
  version_url: nginx/nginx
  version_filter: alpha;rc;candidate;beta;pre
  version_scheme: RPM
